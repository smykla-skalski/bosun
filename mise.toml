[tools]
actionlint = "1.7.12"
go = "1.27.2"

[tasks.deps]
description = "Download Go modules"
run = "go mod download"

[tasks.tidy]
description = "Update Go module metadata"
run = "go mod tidy"

[tasks.fmt]
description = "Format Go source files"
run = "find . -name '*.go' -not -path './.git/*' -exec gofmt -w {} +"

[tasks."fmt:check"]
description = "Check Go source formatting"
run = '''
file_list="$(mktemp)"
trap 'rm -f "$file_list"' EXIT
find . -name '*.go' -not -path './.git/*' -print0 > "$file_list" || exit 1
output="$(xargs -0 gofmt -l < "$file_list")" || exit 1
test -z "$output" || { printf '%s\n' "$output"; exit 1; }
'''

[tasks.lint]
description = "Run static Go checks"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks."test:race"]
description = "Run Go tests with the race detector"
run = "go test -race ./..."

[tasks.bench]
description = "Run Go benchmarks"
run = "go test -run '^$' -bench . -benchmem ./..."

[tasks.build]
description = "Build the Bosun binary"
run = "mkdir -p build && go build -trimpath -o build/bosun ./cmd/bosun"

[tasks."replies:generate"]
description = "Generate the Polish reply catalog"
run = "go run ./tools/replygen"

[tasks."replies:check"]
description = "Check the Polish reply catalog"
run = "go run ./tools/replygen -check"

[tasks."workflow:check"]
description = "Check GitHub Actions workflows"
run = "actionlint .github/workflows/*.yaml"

[tasks."docker:build"]
description = "Build the container image"
run = "docker build --pull --platform linux/amd64 --tag bosun:local ."

[tasks."fly:validate"]
description = "Validate the Fly configuration"
run = '''
: "${FLY_APP_NAME:?set FLY_APP_NAME}"
fly_app_name="$FLY_APP_NAME"
fly config validate --app "$fly_app_name" --config fly.toml --strict
'''

[tasks."fly:deploy"]
description = "Deploy Bosun to Fly"
run = '''
: "${FLY_APP_NAME:?set FLY_APP_NAME}"
fly_app_name="$FLY_APP_NAME"
fly deploy --app "$fly_app_name" --config fly.toml --ha=false --no-public-ips
fly scale count 1 --app "$fly_app_name" --config fly.toml --region fra --yes
'''

[tasks.check]
description = "Run all local checks"
depends = ["fmt:check", "replies:check", "workflow:check", "lint", "test", "test:race", "build"]
